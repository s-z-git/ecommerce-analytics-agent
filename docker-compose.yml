# 一键起：docker compose up --build
# 需要环境变量 DEEPSEEK_API_KEY（可在项目根目录 .env 里写，compose 会自动读取）
services:
  api:
    build: .
    image: ecommerce-analytics:latest
    ports:
      - "8000:8000"
    environment: &app_env
      DB_PATH: /app/data/warehouse/olist.duckdb
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请先设置 DEEPSEEK_API_KEY（或在项目根目录 .env 中写）}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      SQL_TIMEOUT_SECONDS: ${SQL_TIMEOUT_SECONDS:-10}
      MAX_ROWS: ${MAX_ROWS:-1000}
      MEMORY_LIMIT: ${MEMORY_LIMIT:-2GB}
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ui:
    image: ecommerce-analytics:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      <<: *app_env
    volumes:
      - ./data:/app/data:ro
    command: ["streamlit", "run", "src/ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
