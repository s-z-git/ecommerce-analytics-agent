name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q src scripts eval
      - name: Pytest
        run: python -m pytest -q
      - name: Check metrics (if database exists)
        run: |
          if [ -f data/warehouse/olist.duckdb ]; then
            python scripts/check_metrics.py
          else
            echo "No database in repo; check_metrics skipped."
          fi
