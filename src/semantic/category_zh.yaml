# 品类码 → 中文名（B4a）
#
# 用途：语义层把结果翻回中文。`category_revenue` / `seller_revenue` 这类 topn 指标
# 的分组列直接是库里的产品品类码（葡语），业务方看不懂 `beleza_saude` 这种值。
#
# 约束：
#   1. 键集合必须与 `products.product_category_name` 的非空去重值**完全一致**（73 个）。
#      `tests/test_category_zh.py` 会对着真实库断言，漏一个或多的一个都会红。
#   2. 空值（610 行）不进本表，继续由 SQL 的 `COALESCE(..., '未分类')` 处理。
#   3. 只做展示层翻译，**不改 SQL、不改指标契约**，所以 73 题回归零风险。
#
# 改数据源时：`scripts/build_db.py` 重建后若品类码集合变化，本表要同步改，
# 否则测试会立刻失败（这是有意设计——静默显示英文码比测试报错更糟）。

